name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Same image, credentials and host port as docker-compose.yml, so
        # DATABASE_URL is identical locally and in CI.
        image: public.ecr.aws/docker/library/postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: piggygang_indexer
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:password@localhost:5433/piggygang_indexer
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.90"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The Dockerfile stages config/ into the admin image with a literal
      # `${BIN}` = "indexer-admin" compare. A package rename would otherwise
      # produce a green build whose `seed` fails only at run time.
      #
      # The ingester needs the same guard for a different reason: `BIN` is a
      # service variable set only in .railway/railway.ts, which is dockerignored,
      # in no watchPatterns and never otherwise parsed here — and the IaC engine
      # ships in the CLI, so there is no offline typecheck of that file. Without
      # these greps a package rename is green in CI and fails on Railway with
      # `no bin target named 'indexer-ingester'`.
      - name: BIN literals match their package names
        run: |
          grep -qF 'name = "indexer-admin"' services/admin/Cargo.toml
          grep -qF '"${BIN}" = "indexer-admin"' Dockerfile
          grep -qF 'name = "indexer-ingester"' services/ingester/Cargo.toml
          grep -qF 'BIN: "indexer-ingester"' .railway/railway.ts
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # DB tests are #[ignore]d so a laptop without Postgres stays green;
      # here they must run (and a missing DATABASE_URL would fail them).
      - run: cargo test --workspace -- --include-ignored
      - name: migrate + seed twice (end-to-end idempotency)
        run: |
          cargo run -p indexer-admin -- migrate
          cargo run -p indexer-admin -- seed
          cargo run -p indexer-admin -- seed --expect-unchanged
      # The `openapi` job proves the CONTRACT is servable, by mocking it. This
      # proves the API SERVES the contract, by putting Prism in front of the
      # real binary in proxy mode: it forwards each request upstream and
      # validates the response that comes back against the schema, so a
      # response that has drifted is a failed build rather than a surprise in
      # the Explorer.
      #
      # It lives in this job because it needs Rust and Postgres, which the
      # `openapi` job has neither of; only Node is missing here. A new job
      # would be fine, a new workflow file would not — Railway waits on the
      # commit's check suites and one workflow is one suite.
      - uses: actions/setup-node@v5
        with:
          node-version: "24.19.0"
      # A fixture, so the proxy validates the schemas a registry-only database
      # leaves empty: NftDetail, ActivityEvent (both branches of its kind-
      # dependent nullability) and the summary strip. Every key below is
      # SYNTHETIC and copied from the contract's own examples — no on-chain
      # address enters this repo outside config/ (CLAUDE.md).
      - name: One synthetic asset, so the detail half is not an empty page
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO assets (address, collection_id, name, owner, owner_slot)
          SELECT 'SYNarqd6dg3ZygtDhD8CNLqE8wPNdAqWv7', id, '#1',
                 'HLDAXhwhoQo8vntbEMc231443cEQijZ4B', 318442901
            FROM collections WHERE slug = 'piggy-sol-gang';
          INSERT INTO activity (asset_id, collection_id, signature, slot, block_time, kind,
                                from_owner, to_owner, price_lamports, marketplace, source)
          SELECT a.id, a.collection_id,
                 'SgnS8C2hGJTEB8gKuwtW4rzQxwsYFg3JGZYS8C2hGJTEB8gKuwtW4rzQxwsYFg3JGZYS8C2hGJTEB8gKuwtW4rz',
                 97441201, '2021-09-14T17:03:11Z', 'mint',
                 NULL, 'HLDoLKj9p8xFdCKpffq7xNpPd3ACapACP', NULL, NULL, 'manual'
            FROM assets a WHERE a.address = 'SYNarqd6dg3ZygtDhD8CNLqE8wPNdAqWv7';
          INSERT INTO activity (asset_id, collection_id, signature, slot, block_time, kind,
                                from_owner, to_owner, price_lamports, marketplace, source)
          SELECT a.id, a.collection_id,
                 'SgnCAZcw6LM5wbp1D8JdXCb6f4w3UFN3J96CAZcw6LM5wbp1D8JdXCb6f4w3UFN3J96CAZcw6LM5wbp1D8JdXCb',
                 318442901, '2026-08-30T21:14:22Z', 'sale',
                 'HLDoLKj9p8xFdCKpffq7xNpPd3ACapACP', 'HLDAXhwhoQo8vntbEMc231443cEQijZ4B',
                 12500000000, 'Tensor', 'manual'
            FROM assets a WHERE a.address = 'SYNarqd6dg3ZygtDhD8CNLqE8wPNdAqWv7';
          SQL
      - name: The API conforms to the frozen contract
        run: |
          cargo run -p indexer-api &
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8080/health >/dev/null && break
            sleep 1
          done
          npx --yes @stoplight/prism-cli@5.15.10 proxy \
            -h 127.0.0.1 -p 4011 --errors openapi/v1.yaml http://127.0.0.1:8080 &
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:4011/v1/collections >/dev/null && break
            sleep 1
          done
          # The same shapes the mock is exercised with, so the contract is
          # checked from both sides against one set of URLs. Every path in the
          # document appears here: a response Prism cannot validate is a
          # response nothing checks.
          P=http://127.0.0.1:4011/v1
          A=SYNarqd6dg3ZygtDhD8CNLqE8wPNdAqWv7
          W=HLDAXhwhoQo8vntbEMc231443cEQijZ4B
          curl -sf $P/collections | grep -q piggy-sol-gang
          curl -sf $P/collections/piggy-sol-gang >/dev/null
          curl -sf $P/collections/piggy-sol-gang/facets >/dev/null
          curl -sf "$P/collections/piggy-sol-gang/nfts?trait%5BHead%5D=Crown&sort=-activity" >/dev/null
          curl -sf "$P/collections/piggy-sol-gang/activity?kind=sale&kind=mint" >/dev/null
          curl -sf $P/collections/piggy-sol-gang/holders >/dev/null
          curl -sf $P/nfts/$A | grep -q activitySummary
          curl -sf "$P/nfts/$A/activity?limit=1" >/dev/null
          curl -sf $P/nfts/$A/owners >/dev/null
          curl -sf "$P/wallets/$W/nfts?collection=piggy-sol-gang" >/dev/null
          curl -sf "$P/search?q=%231" >/dev/null
          curl -sf "$P/search?q=$A" | grep -q '"kind":"nft"'
          # Error bodies are part of the contract too. A well-formed request
          # that finds nothing reaches the API, so the proxy validates the 404
          # body against the `Error` schema; `-f` would swallow it, hence the
          # status assertion.
          test "$(curl -s -o /dev/null -w '%{http_code}' $P/nfts/HLDz7xArdTQeiCeKHg3VqhhNXzZGH5qBS)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' "$P/collections/piggy-sol-gang/nfts?sort=rarity")" = 422
          # A MALFORMED request never reaches the API: Prism validates the
          # request first and answers 422 itself. So the parameter rules are
          # asserted against the API directly — the proxy structurally cannot
          # see them.
          D=http://127.0.0.1:8080/v1
          test "$(curl -s -o /dev/null -w '%{http_code}' $D/nfts/not-base58)" = 400
          test "$(curl -s -o /dev/null -w '%{http_code}' "$D/nfts/$A/activity?limit=101")" = 400
          test "$(curl -s -o /dev/null -w '%{http_code}' "$D/nfts/$A/activity?kind=listing")" = 400
          test "$(curl -s -o /dev/null -w '%{http_code}' $D/search)" = 400

  # The frozen v1 API contract (ALG-620). A separate job with no `needs:`, so it
  # runs in parallel with `check` and adds no wall-clock time — `check` compiles
  # the workspace and runs migrations, this lints one YAML file.
  #
  # Kept in THIS workflow rather than a new file on purpose: Railway waits on
  # the commit's check suites, and one workflow is one suite. A second workflow
  # would create a second suite. Note the consequence: a spec-only lint failure
  # now blocks production deploys of unrelated Rust changes.
  openapi:
    runs-on: ubuntu-latest
    env:
      REDOCLY_TELEMETRY: "off"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24.19.0"
      # Lint proves the document is valid OpenAPI and that every example still
      # matches its schema — Prism serves those examples verbatim to the
      # Explorer, so a drifted example is a silently wrong mock.
      - name: Lint the frozen v1 contract
        run: npx --yes @redocly/cli@2.49.0 lint --config openapi/redocly.yaml
      # Lint cannot see whether Prism can actually serve the document. This can:
      # it boots the mock and exercises the shapes the Explorer depends on,
      # including a bracketed trait filter, which OpenAPI leaves undefined for
      # deepObject and which no linter validates.
      - name: Mock server boots and serves the contract
        run: |
          npx --yes @stoplight/prism-cli@5.15.10 mock \
            -h 127.0.0.1 -p 4010 --errors --no-multiprocess openapi/v1.yaml &
          for _ in $(seq 1 40); do
            curl -sf http://127.0.0.1:4010/v1/collections >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:4010/v1/collections | grep -q piggy-sol-gang
          curl -sf http://127.0.0.1:4010/v1/collections/piggy-sol-gang/facets >/dev/null
          curl -sf 'http://127.0.0.1:4010/v1/collections/piggy-sol-gang/nfts?trait%5BHead%5D=Crown&sort=-activity' >/dev/null
      # The Explorer (ALG-630) generates its typed client from this file; if
      # codegen breaks, the contract is not usable no matter how valid it is.
      - name: Contract generates a TypeScript client
        run: npx --yes openapi-typescript@7 openapi/v1.yaml -o /tmp/api.gen.ts
