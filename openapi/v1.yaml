# The FROZEN v1 contract (ALG-620). The schema serves this file; this file never
# bends to the schema (CLAUDE.md). Implemented by ALG-625 (browse/facets) and
# ALG-626 (detail/activity/portfolio); consumed by piggygang-explorer (ALG-630),
# which generates its client from it and develops against the Prism mock
# (`docker compose up -d mock`).
#
# Conventions:
#   * JSON fields are camelCase (pre-committed by the migrations, e.g.
#     `NftDetail.metadataUri` in 20260829000300_assets_attributes.sql:26).
#   * Enum VALUES are the Postgres CHECK literals verbatim (snake_case), which
#     is what crates/data-model/src/types.rs already serializes.
#   * Every property is `required`; nullable ones are serialized as explicit
#     null. Clients get `T | null`, never `T | null | undefined`.
#   * On-chain addresses live only in config/ (CLAUDE.md). Every address and
#     signature below is SYNTHETIC — the SYN/HLD/SIG prefixes mark them.
openapi: 3.1.0

info:
  title: PiggyGang Indexer API
  version: 1.0.0
  summary: Read-only index of the PiggyGang Solana NFT collections.
  description: |
    Public, read-only, unauthenticated JSON API over the PiggyGang indexer.

    ## Versioning

    The major version is a **path prefix** (`/v1/...`) — not a header, not a
    media type, and deliberately **not** part of the server URL. Keeping it in
    the path means the Prism mock (which has no basePath support) serves exactly
    the URLs production serves, so switching the Explorer between them is one
    environment variable.

    `/v1` is frozen. Additive changes only: new endpoints, new optional query
    parameters, new response fields, new members of a *request* enum, new
    response headers. Anything else — removing or renaming a field, changing a
    type or nullability, making a parameter required, or adding a member to a
    *response* enum that is not already reserved — requires `/v2`.

    `/health` and `/ready` are operational endpoints. They live outside `/v1`
    and are deliberately not described here.

    ## The browse population

    Every list and facet count over a collection uses exactly
    `collection_id = <slug> AND membershipStatus = 'member'`. **Burned assets are
    included** — the UI greys them out via `burned` — and there is deliberately
    no `burned` query filter. Only `stats.supply` and `stats.holders` exclude
    them.

    ## Pagination

    Keyset (cursor) pagination throughout, never offset. Echo `nextCursor`
    verbatim; never decode or construct one. A cursor is valid only for the
    endpoint, sort and filter set it was issued for — anything else is
    `400 invalid_cursor`, which is a normal recoverable condition (restart from
    page one), not an outage.

    Stability under live updates:
      * `sort=number` / `sort=name` — keys never move; paging is exact.
      * `sort=-activity` — the key moves. An asset that receives an event jumps
        above your cursor, so this sort **can skip rows** and can never
        duplicate them. Infinite scroll must de-duplicate by `address`.
      * activity and owners feeds are append-only and newest-first, so fetched
        pages stay stable; new events appear by re-requesting page one.

    There is no `total` on paginated envelopes: keyset pagination has no cheap
    total. The filtered result count is `FacetsResponse.total` (that endpoint
    already pays for the scan); unfiltered it is `CollectionStats.indexed`.

    ## Caching

    Every `GET` returns a weak `ETag` and a short `Cache-Control`. Send
    `If-None-Match` to get `304`. The exact `max-age` is operational and may
    change without a version bump — depend on the header's presence, not its
    value.

    ## Errors

    `{ "error": "<code>", "message": "...", "details": {...} }`. Switch on
    `error`; never parse `message`. An unknown trait type or value is **not** an
    error: it returns `200` with an empty result set, so a bookmarked filter URL
    survives a metadata refresh.
  contact:
    name: AlgoLab
    url: https://piggygang.net
  license:
    name: UNLICENSED
    identifier: LicenseRef-proprietary

# Public and unauthenticated. Declared explicitly so reviewers can see it was a
# decision, and so Redocly's `security-defined` rule is satisfied.
security: []

servers:
  - url: https://api.indexer.piggygang.net
    description: Production (Railway, EU West Metal / Amsterdam)
  - url: http://localhost:8080
    description: Local API — `cargo run -p indexer-api`
  - url: http://localhost:4010
    description: Prism mock — `docker compose up -d mock`

tags:
  - name: collections
    description: The registry, its stats, and everything scoped to one collection.
  - name: nfts
    description: A single asset — detail, activity timeline, ownership history.
  - name: wallets
    description: Cross-collection portfolio for one owner.
  - name: search
    description: Global smart search.

