  /v1/search:
    get:
      operationId: search
      tags: [search]
      summary: Global smart search across every indexed collection
      description: |
        One box that understands what is pasted into it.

        * A base58 address resolves by lookup: a known mint routes to that NFT,
          a wallet holding indexed assets routes to that wallet, anything else
          resolves to nothing — `200` with an empty result, never `404`.
        * Anything else is text: `#N` matches the token number, otherwise a
          case-insensitive substring of the name, grouped by collection.

        `route` is the server's opinion about where the Enter key should go;
        `groups` is what the palette lists. Both are always present.
      parameters:
        - name: q
          in: query
          required: true
          description: The raw search input.
          schema: { type: string, minLength: 1, maxLength: 64 }
        - name: collection
          in: query
          required: false
          description: Restrict text results to a single collection.
          schema: { type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$', maxLength: 64 }
        - name: limit
          in: query
          required: false
          description: Maximum NFT results per collection group.
          schema: { type: integer, minimum: 1, maximum: 25, default: 10 }
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Search results.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
            Vary: { $ref: '#/components/headers/Vary' }
            X-RateLimit-Limit: { $ref: '#/components/headers/XRateLimitLimit' }
            X-RateLimit-Remaining: { $ref: '#/components/headers/XRateLimitRemaining' }
            X-RateLimit-Reset: { $ref: '#/components/headers/XRateLimitReset' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResponse' }
              examples:
                byNumber:
                  summary: '"#1" — grouped NFT hits'
                  value:
                    query: '#1'
                    interpretedAs: number
                    route: null
                    wallet: null
                    groups:
                      - collection: { slug: piggy-sol-gang, name: Piggy SOL Gang, imageUrl: null }
                        total: 1
                        nfts:
                          - address: SYNarqd6dg3ZygtDhD8CNLqE8wPNdAqWv7
                            name: 'Piggy SOL Gang #1'
                            number: 1
                            imageUri: https://pub-b1a45763f0a64d8fa271f66f5514a561.r2.dev/old/images/1.png
                            imageStatus: ok
                            burned: false
                            owner: HLDAXhwhoQo8vntbEMc231443cEQijZ4B
                            lastActivityAt: '2026-08-30T21:14:22Z'
                            rarityRank: null
                            rarityScore: null
                            collection: { slug: piggy-sol-gang, name: Piggy SOL Gang, imageUrl: null }
                byMint:
                  summary: 'A pasted mint routes straight to the NFT — `Prefer: example=byMint`'
                  value:
                    query: SYNarqd6dg3ZygtDhD8CNLqE8wPNdAqWv7
                    interpretedAs: address
                    route: { kind: nft, id: SYNarqd6dg3ZygtDhD8CNLqE8wPNdAqWv7 }
                    wallet: null
                    groups: []
                byWallet:
                  summary: 'A pasted wallet routes to the portfolio — `Prefer: example=byWallet`'
                  value:
                    query: HLDAXhwhoQo8vntbEMc231443cEQijZ4B
                    interpretedAs: address
                    route: { kind: wallet, id: HLDAXhwhoQo8vntbEMc231443cEQijZ4B }
                    wallet: { address: HLDAXhwhoQo8vntbEMc231443cEQijZ4B, totalCount: 20 }
                    groups: []
                nothing:
                  summary: 'Nothing indexed — `Prefer: example=nothing`'
                  value:
                    query: SYNu6skvdET1pB8qq9EAwQ3Lj7G98W8ZQC
                    interpretedAs: address
                    route: null
                    wallet: null
                    groups: []
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

components:
  parameters:
    CollectionSlug:
      name: slug
      in: path
      required: true
      description: The collection's URL slug.
      schema:
        type: string
        pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
        maxLength: 64
      example: piggy-sol-gang

    NftId:
      name: id
      in: path
      required: true
      description: >-
        The NFT's on-chain address — the mint for Token Metadata assets, the
        asset id for Metaplex Core. Internal database ids are never exposed.
      schema:
        type: string
        pattern: '^[1-9A-HJ-NP-Za-km-z]{32,44}$'
      example: SYNarqd6dg3ZygtDhD8CNLqE8wPNdAqWv7

    WalletAddress:
      name: address
      in: path
      required: true
      description: A Solana wallet address.
      schema:
        type: string
        pattern: '^[1-9A-HJ-NP-Za-km-z]{32,44}$'
      example: HLDAXhwhoQo8vntbEMc231443cEQijZ4B

    TraitFilter:
      name: trait
      in: query
      required: false
      style: deepObject
      explode: true
      description: |
        Attribute filter, expressed with bracketed keys:

            ?trait[Background]=Pink&trait[Background]=Blue&trait[Head]=Crown

        Repeating a trait type ORs its values; distinct trait types AND
        together. Trait type names and values are matched **exactly and
        case-sensitively** against the collection's own dictionary —
        `Background` and `background` are different keys and only one exists.

        Brackets may be sent literally or percent-encoded (`%5B` / `%5D`).

        Unknown input is never a 4xx, so a bookmarked URL survives a metadata
        refresh: an unknown trait *type* yields an empty result set and
        `facets: []`; an unknown *value* still counts its type as selected, so
        it matches nothing and every other type's counts collapse to zero.

        At most 16 distinct trait types and 64 values per request.

        TOOLING NOTE: OpenAPI 3.1 states that for `deepObject` "the
        representation of array or object properties is not defined", so this
        wire format — not any generator's interpretation of it — is normative.
        openapi-fetch's default query serializer throws on this shape; supply a
        custom `querySerializer` (the repository README has one). Prism ignores
        this parameter entirely, so the mock returns the same page with or
        without it.
      schema:
        type: object
        additionalProperties:
          type: array
          minItems: 1
          maxItems: 64
          items:
            type: string
            minLength: 1
            maxLength: 128
      example:
        Background: [Pink, Blue]
        Head: [Crown]

    Q:
      name: q
      in: query
      required: false
      description: |
        Text search — exactly three OR'd predicates, and nothing more:

          1. base58 address **prefix**, case-sensitive;
          2. exact token number, when the input looks like `#N` or `N`;
          3. case-insensitive **substring** of the name.

        This is not fuzzy and not typo-tolerant: `Pnk` does not find `Pink`.
        Surrounding whitespace is trimmed, an empty result is treated as absent,
        and `%`, `_` and `\` match literally.
      schema:
        type: string
        minLength: 1
        maxLength: 64
      example: '#1234'

    Sort:
      name: sort
      in: query
      required: false
      description: |
        A leading `-` means descending; each direction is a scan of the same
        index. There is deliberately no price or mint-date sort — no such column
        exists.

        `name` sorts by **byte order**, not locale: `#1` < `#10` < `#2`, and
        uppercase sorts before lowercase. Assets with no number sort last under
        `number`; assets that have never been active sort first under
        `activity`.

        `rarity` and `-rarity` are reserved so the client union stays stable
        when rarity scoring ships; until then they return
        `422 unsupported_sort`.
      schema:
        type: string
        default: number
        enum: [number, '-number', name, '-name', activity, '-activity', rarity, '-rarity']

    ActivityKindFilter:
      name: kind
      in: query
      required: false
      style: form
      explode: true
      description: 'Repeat to OR: `?kind=sale&kind=transfer`. Omit for all public kinds.'
      schema:
        type: array
        uniqueItems: true
        maxItems: 4
        items:
          type: string
          enum: [mint, transfer, sale, burn]

    Limit:
      name: limit
      in: query
      required: false
      description: >-
        Page size. The default 24 divides by 2, 3, 4 and 6, so a grid has no
        ragged last row at any common column count. Exceeding the maximum is
        `422`, never a silent clamp.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 24

    Cursor:
      name: cursor
      in: query
      required: false
      description: >-
        Opaque keyset cursor. Echo `nextCursor` verbatim; never decode, parse or
        construct one. Valid only for the endpoint, sort and filter set that
        issued it, and not guaranteed stable across deploys — treat
        `400 invalid_cursor` as normal and restart from page one.
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{8,512}$'

    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: Echo a previously received `ETag` to receive `304` with no body.
      schema: { type: string }
      example: 'W/"1f0a2b3c4d5e6f70"'

  headers:
    ETag:
      description: >-
        Weak validator over the response body. Weak because the same resource
        may be served with different content codings.
      schema: { type: string }
      example: 'W/"1f0a2b3c4d5e6f70"'
    CacheControl:
      description: >-
        Always `public` with a short `max-age`. The exact value is operational
        and may change without a version bump — depend on the header's presence,
        not its value.
      schema: { type: string }
      example: public, max-age=15, stale-while-revalidate=30
    Vary:
      description: Response varies by encoding and by CORS origin.
      schema: { type: string }
      example: Accept-Encoding, Origin
    XRateLimitLimit:
      description: Requests permitted in the current window.
      schema: { type: integer }
      example: 120
    XRateLimitRemaining:
      description: Requests left in the current window.
      schema: { type: integer }
      example: 118
    XRateLimitReset:
      description: >-
        Unix timestamp (seconds, UTC) at which the window resets — absolute,
        unlike `Retry-After`, which is delta-seconds.
      schema: { type: integer }
      example: 1788240600
    RetryAfter:
      description: Seconds to wait before retrying.
      schema: { type: integer, minimum: 1 }
      example: 12

  responses:
    NotModified:
      description: >-
        The client's `If-None-Match` matched. No body. Validators are repeated so
        the client can refresh its freshness window without a second round trip.
      headers:
        ETag: { $ref: '#/components/headers/ETag' }
        Cache-Control: { $ref: '#/components/headers/CacheControl' }
        Vary: { $ref: '#/components/headers/Vary' }
        X-RateLimit-Limit: { $ref: '#/components/headers/XRateLimitLimit' }
        X-RateLimit-Remaining: { $ref: '#/components/headers/XRateLimitRemaining' }
        X-RateLimit-Reset: { $ref: '#/components/headers/XRateLimitReset' }

    BadRequest:
      description: A parameter could not be parsed, or a cursor no longer applies.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            badAddress:
              summary: Not a base58 address
              value:
                error: invalid_parameter
                message: '`id` is not a base58 address'
                details: { parameter: id }
            staleCursor:
              summary: Cursor issued for a different sort or filter set
              value:
                error: invalid_cursor
                message: cursor was issued for a different sort or filter set
                details: { parameter: cursor }

    NotFound:
      description: >-
        No such resource. Applies to unknown or disabled collection slugs and to
        unknown NFT addresses. Never used for wallets — an unknown wallet is
        `200` with an empty portfolio.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            unknownSlug:
              value:
                error: not_found
                message: 'no enabled collection with slug `piggy-cows`'
                details: { slug: piggy-cows }

    UnprocessableEntity:
      description: Syntactically valid but semantically rejected.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            rarityNotReady:
              summary: Rarity sorting is reserved but not yet available
              value:
                error: unsupported_sort
                message: sort=rarity is not available until rarity scoring ships
                details:
                  parameter: sort
                  supported: [number, '-number', name, '-name', activity, '-activity']

    RateLimited:
      description: Too many requests.
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
        X-RateLimit-Limit: { $ref: '#/components/headers/XRateLimitLimit' }
        X-RateLimit-Remaining: { $ref: '#/components/headers/XRateLimitRemaining' }
        X-RateLimit-Reset: { $ref: '#/components/headers/XRateLimitReset' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            limited:
              value:
                error: rate_limited
                message: rate limit exceeded; retry after 12 s
                details: { retryAfter: 12 }

    InternalError:
      description: >-
        Unexpected server error. `message` is generic on purpose; correlate with
        the API logs by timestamp.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            boom:
              value:
                error: internal
                message: internal server error
                details: null

  schemas:
    Address:
      type: string
      pattern: '^[1-9A-HJ-NP-Za-km-z]{32,44}$'
      description: >-
        Base58 Solana public key. Compared byte-exactly — every address column
        uses the C collation.
      examples: [SYNarqd6dg3ZygtDhD8CNLqE8wPNdAqWv7]

    Signature:
      type: string
      pattern: '^[1-9A-HJ-NP-Za-km-z]{86,88}$'
      description: Base58 transaction signature.

    Slug:
      type: string
      pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
      maxLength: 64
      description: A collection's URL slug.
      examples: [piggy-sol-gang]

    Lamports:
      type: string
      pattern: '^(0|[1-9][0-9]{0,19})$'
      description: >-
        A lamport amount as a decimal string (1 SOL = 1,000,000,000 lamports).
        A string rather than a number so the full u64 range round-trips exactly
        and so nobody divides by 1e9 in floating point. Parse with BigInt or a
        decimal library.
      examples: ['12500000000']

    Int64String:
      type: string
      pattern: '^(0|[1-9][0-9]{0,18})$'
      description: >-
        A 64-bit identifier as a decimal string. Opaque — never parse it, never
        put it in a URL path.

    Cursor:
      type: string
      pattern: '^[A-Za-z0-9_-]{8,512}$'
      description: Opaque keyset cursor. Round-trip verbatim.

    ImageStatus:
      type: string
      enum: [unknown, ok, dead]
      description: >-
        Reachability of `imageUri`. `dead` means the 2021-era host is gone —
        render a placeholder rather than a broken image. `unknown` means it has
        not been checked; load it optimistically.

    Standard:
      type: string
      enum: [token_metadata, core]
      description: The token standard. A collection cannot mix standards.

    MembershipRule:
      type: string
      enum: [core_collection, tm_collection, tm_allowlist]
      description: >-
        How membership is derived. `core_collection` grows on its own as assets
        are minted into it; `tm_allowlist` is a closed, committed mint list.

    ActivityKind:
      type: string
      enum: [mint, transfer, sale, burn, stake, unstake, other]
      description: >-
        The full set the indexer classifies. v1 serves only `mint`, `transfer`,
        `sale` and `burn`; the rest are **reserved** and may begin appearing
        without a version bump. Clients must tolerate every member — treat an
        unrecognised kind as a generic timeline entry rather than crashing.

    CollectionRef:
      type: object
      additionalProperties: false
      description: >-
        Compact collection identity, carried by every NFT card so cross-
        collection grids render a badge without a second request.
      required: [slug, name, imageUrl]
      properties:
        slug: { $ref: '#/components/schemas/Slug' }
        name: { type: string, maxLength: 128 }
        imageUrl:
          type: [string, 'null']
          description: >-
            Collection artwork. Null for every collection today — the column
            exists but no value is configured yet.

    Collection:
      type: object
      additionalProperties: false
      description: >-
        A registered, enabled collection. Disabled collections are never
        returned, so `enabled` is not serialized.
      required: [slug, name, standard, membershipRule, address, symbol, imageUrl, stats]
      properties:
        slug: { $ref: '#/components/schemas/Slug' }
        name: { type: string, maxLength: 128 }
        standard: { $ref: '#/components/schemas/Standard' }
        membershipRule: { $ref: '#/components/schemas/MembershipRule' }
        address:
          oneOf:
            - $ref: '#/components/schemas/Address'
            - type: 'null'
          description: >-
            The Core collection address, or the certified Token Metadata
            collection mint. Null for allowlist collections — the three Piggy
            Token Metadata collections have no certified collection on chain.
        symbol:
          type: [string, 'null']
          maxLength: 10
        imageUrl:
          type: [string, 'null']
        stats:
          oneOf:
            - $ref: '#/components/schemas/CollectionStats'
            - type: 'null'

    CollectionStats:
      type: object
      additionalProperties: false
      description: Short-TTL cached aggregates.
      required:
        [supply, holders, burned, indexed, activity24h, activity7d,
         lastActivityAt, holderDistribution, asOf]
      properties:
        supply:
          type: integer
          minimum: 0
          description: Member assets, **excluding** burned.
        holders:
          type: integer
          minimum: 0
          description: Distinct current owners. Burned assets have no owner, so they drop out.
        burned:
          type: integer
          minimum: 0
        indexed:
          type: integer
          minimum: 0
          description: >-
            The browse population — members including burned, i.e.
            `supply + burned`. This is the unfiltered result count for the
            browse endpoint.
        activity24h:
          type: integer
          minimum: 0
          description: >-
            Events in the last 24 hours. Counts **all** classified kinds, so it
            can exceed the number of events the public timeline shows.
        activity7d:
          type: integer
          minimum: 0
          description: Events in the last 7 days, with the same caveat as `activity24h`.
        lastActivityAt:
          type: [string, 'null']
          format: date-time
        holderDistribution:
          type: array
          description: >-
            Holder cohorts. An array rather than fixed fields so the bucket
            edges can be retuned without a contract change. `assets` sums to
            `supply`.
          items: { $ref: '#/components/schemas/HolderBucket' }
        asOf:
          type: string
          format: date-time
          description: When these numbers were computed.

    HolderBucket:
      type: object
      additionalProperties: false
      required: [label, minCount, maxCount, holders, assets]
      properties:
        label: { type: string, examples: ['2-5'] }
        minCount: { type: integer, minimum: 1 }
        maxCount:
          type: [integer, 'null']
          description: Null means unbounded.
        holders: { type: integer, minimum: 0 }
        assets: { type: integer, minimum: 0 }

    NftSummary:
      type: object
      # No additionalProperties/unevaluatedProperties here: this schema is an
      # allOf base (see NftDetail), and closing a base rejects the extension's
      # own properties. The composed schemas close themselves with
      # `unevaluatedProperties: false`, which is the 2020-12 idiom for this.
      description: >-
        The grid card — one asset row plus its collection badge. Burned assets
        are part of the browse population; `burned` is what greys the card out.
      required:
        [address, name, number, imageUri, imageStatus, burned, owner,
         lastActivityAt, rarityRank, rarityScore, collection]
      properties:
        address:
          $ref: '#/components/schemas/Address'
        name:
          type: string
          description: May be the empty string before the metadata backfill has run.
        number:
          type: [integer, 'null']
          description: >-
            The `#N` parsed out of the name, or null when the name has none.
            Unnumbered assets sort last under `sort=number`.
        imageUri:
          type: [string, 'null']
          description: >-
            Where the image actually lives — already the re-hosted URL for
            collections whose original host is gone. Not validated as a URI:
            2021-era metadata carries `ipfs://`, `ar://` and worse.
        imageStatus: { $ref: '#/components/schemas/ImageStatus' }
        burned: { type: boolean }
        owner:
          oneOf:
            - $ref: '#/components/schemas/Address'
            - type: 'null'
          description: Current owner. Null when burned or not yet known.
        lastActivityAt:
          type: [string, 'null']
          format: date-time
        rarityRank:
          type: [integer, 'null']
          minimum: 1
          description: Reserved — always null until rarity scoring ships.
        rarityScore:
          type: [number, 'null']
          description: Reserved — always null until rarity scoring ships.
        collection: { $ref: '#/components/schemas/CollectionRef' }

    # NOTE ON allOf AND CLOSED OBJECTS: NftSummary/ActivityEvent are allOf
    # bases and NftDetail/CollectionActivityEvent compose them, so none of the
    # four sets `additionalProperties: false` — closing a base rejects the
    # extension's own fields, and `unevaluatedProperties` is not resolved
    # across `allOf` + `$ref` by the validators in this toolchain (Redocly and
    # most codegen). Every other schema in this document is closed. Drift in
    # these four is caught by the Explorer's generated client and by ALG-625's
    # contract tests instead.
    NftDetail:
      allOf:
        - $ref: '#/components/schemas/NftSummary'
        - type: object
          description: Everything that needs a second table.
          required:
            [standard, symbol, membershipStatus, removedAt, metadataUri,
             metadataSourceUri, imageCheckedAt, updatedAt, attributes,
             ownership, mint, activitySummary]
          properties:
            standard: { $ref: '#/components/schemas/Standard' }
            symbol: { type: [string, 'null'] }
            membershipStatus:
              type: string
              enum: [member, removed]
              description: >-
                Always `member` in list responses. A Core asset whose update
                authority moved it out of the collection is still addressable
                here and reports `removed`.
            removedAt:
              type: [string, 'null']
              format: date-time
            metadataUri:
              type: [string, 'null']
              description: The URI recorded on chain. May point at a dead host.
            metadataSourceUri:
              type: [string, 'null']
              description: The URI actually fetched. This is the link that still resolves.
            imageCheckedAt:
              type: [string, 'null']
              format: date-time
            updatedAt:
              type: string
              format: date-time
            attributes:
              type: array
              description: >-
                All attributes, including non-facetable trait types — those are
                shown on the detail page but never appear in `/facets`.
              items: { $ref: '#/components/schemas/Attribute' }
            ownership: { $ref: '#/components/schemas/OwnerCard' }
            mint: { $ref: '#/components/schemas/MintInfo' }
            activitySummary: { $ref: '#/components/schemas/ActivitySummary' }

    Attribute:
      type: object
      additionalProperties: false
      required: [traitType, value, position, isFacet, rarityPct]
      properties:
        traitType:
          type: string
          description: >-
            Interned per collection — `Background` in two collections is two
            distinct trait types.
        value:
          type: string
          description: >-
            Exact and case-sensitive. Send this string back verbatim as
            `trait[<traitType>]=<value>` to filter on it.
        position:
          type: integer
          minimum: 0
          description: >-
            Display order from the source metadata. Not unique per asset, so
            render ordered by `(position, traitType, value)`.
        isFacet:
          type: boolean
          description: >-
            False means the trait is shown as a chip but excluded from facets —
            such a chip must not link to a filtered browse URL.
        rarityPct:
          type: [number, 'null']
          minimum: 0
          maximum: 100
          description: Reserved — always null until rarity scoring ships.

    OwnerCard:
      type: object
      additionalProperties: false
      description: >-
        The owner card. `heldSince` comes from the open ownership interval, and
        is null when that interval disagrees with the observed owner rather than
        attributing a date to the wrong wallet.
      required: [owner, ownerSlot, heldSince, heldSinceSlot, acquiredBySignature]
      properties:
        owner:
          oneOf:
            - $ref: '#/components/schemas/Address'
            - type: 'null'
        ownerSlot:
          type: [integer, 'null']
          description: The slot at which ownership was observed.
        heldSince:
          type: [string, 'null']
          format: date-time
        heldSinceSlot:
          type: [integer, 'null']
        acquiredBySignature:
          oneOf:
            - $ref: '#/components/schemas/Signature'
            - type: 'null'
          description: >-
            Null means the interval has no known opening transaction — render
            "acquired in an unknown transaction", not an empty link.

    MintInfo:
      type: object
      additionalProperties: false
      description: >-
        There is no mint-date column; this comes from the mint event, so every
        field is null until the activity backfill has run for this asset.
      required: [mintedAt, mintSlot, signature]
      properties:
        mintedAt:
          type: [string, 'null']
          format: date-time
        mintSlot:
          type: [integer, 'null']
        signature:
          oneOf:
            - $ref: '#/components/schemas/Signature'
            - type: 'null'

    ActivitySummary:
      type: object
      additionalProperties: false
      description: The compact strip above the timeline.
      required:
        [salesCount, transferCount, ownerCount, lastSalePriceLamports,
         lastSaleAt, lastSaleMarketplace]
      properties:
        salesCount: { type: integer, minimum: 0 }
        transferCount: { type: integer, minimum: 0 }
        ownerCount: { type: integer, minimum: 0 }
        lastSalePriceLamports:
          oneOf:
            - $ref: '#/components/schemas/Lamports'
            - type: 'null'
        lastSaleAt:
          type: [string, 'null']
          format: date-time
        lastSaleMarketplace: { type: [string, 'null'] }

    ActivityEvent:
      type: object
      # Open for the same reason as NftSummary: it is an allOf base
      # (CollectionActivityEvent) and it applies if/then clauses of its own.
      description: |
        One event. Nullability is kind-dependent, and the `if`/`then` clauses
        below transcribe the database's own constraints so contract tests
        enforce them; code generators ignore them, which is the intended split —
        types for the client, constraints for the tests.

        Narrow client-side with a type guard:

            type Sale = ActivityEvent & { kind: 'sale'; priceLamports: string };
            const isSale = (e: ActivityEvent): e is Sale => e.kind === 'sale';
      required:
        [id, kind, signature, seq, slot, blockTime, fromOwner, toOwner,
         priceLamports, marketplace]
      properties:
        id:
          $ref: '#/components/schemas/Int64String'
        kind: { $ref: '#/components/schemas/ActivityKind' }
        signature: { $ref: '#/components/schemas/Signature' }
        seq:
          type: integer
          minimum: 0
          description: >-
            Ordinal of this asset's events within the transaction. Disambiguates
            two events for one asset in one transaction.
        slot:
          type: integer
          minimum: 0
          description: >-
            A JSON number, not a string: Solana's own RPC types slots as numbers
            and the value stays far below the safe-integer limit.
        blockTime:
          type: string
          format: date-time
          description: >-
            Never null — an event whose block time cannot be resolved is never
            classified in the first place.
        fromOwner:
          oneOf:
            - $ref: '#/components/schemas/Address'
            - type: 'null'
          description: >-
            Always null on `mint`. May be null on a transfer or sale — escrow-era
            marketplaces hide the sender, which is data, not an error.
        toOwner:
          oneOf:
            - $ref: '#/components/schemas/Address'
            - type: 'null'
          description: Always null on `burn`; never null on mint, transfer or sale.
        priceLamports:
          oneOf:
            - $ref: '#/components/schemas/Lamports'
            - type: 'null'
          description: Present exactly on `sale`.
        marketplace:
          type: [string, 'null']
          description: >-
            Free text, not an enum, so the classifier can learn new venues
            without a contract change. Only ever set on a sale, and may be null
            on a sale we could not attribute.
      allOf:
        - if:
            properties: { kind: { const: mint } }
            required: [kind]
          then:
            properties:
              fromOwner: { type: 'null' }
              toOwner: { $ref: '#/components/schemas/Address' }
        - if:
            properties: { kind: { const: burn } }
            required: [kind]
          then:
            properties:
              toOwner: { type: 'null' }
        - if:
            properties: { kind: { enum: [transfer, sale] } }
            required: [kind]
          then:
            properties:
              toOwner: { $ref: '#/components/schemas/Address' }
        - if:
            properties: { kind: { const: sale } }
            required: [kind]
          then:
            properties:
              priceLamports: { $ref: '#/components/schemas/Lamports' }
        - if:
            properties: { kind: { enum: [mint, transfer, burn] } }
            required: [kind]
          then:
            properties:
              priceLamports: { type: 'null' }
              marketplace: { type: 'null' }

    CollectionActivityEvent:
      allOf:
        - $ref: '#/components/schemas/ActivityEvent'
        - type: object
          required: [nft]
          properties:
            nft:
              $ref: '#/components/schemas/NftSummary'

    OwnershipInterval:
      type: object
      additionalProperties: false
      description: >-
        One ownership interval. Intervals never overlap, so `fromSlot`
        identifies a row uniquely for this asset.
      required:
        [owner, fromSlot, fromTs, toSlot, toTs, isCurrent, openedBySignature,
         closedBySignature]
      properties:
        owner: { $ref: '#/components/schemas/Address' }
        fromSlot: { type: integer, minimum: 0 }
        fromTs: { type: string, format: date-time }
        toSlot:
          type: [integer, 'null']
          description: Null while the interval is open.
        toTs:
          type: [string, 'null']
          format: date-time
        isCurrent:
          type: boolean
          description: True exactly when the interval is open.
        openedBySignature:
          oneOf:
            - $ref: '#/components/schemas/Signature'
            - type: 'null'
        closedBySignature:
          oneOf:
            - $ref: '#/components/schemas/Signature'
            - type: 'null'

    Holder:
      type: object
      additionalProperties: false
      required: [address, count, rank]
      properties:
        address: { $ref: '#/components/schemas/Address' }
        count:
          type: integer
          minimum: 1
          description: Assets of this collection held by the wallet.
        rank:
          type: [integer, 'null']
          minimum: 1
          description: >-
            One-based; ties share the lower rank and skip the next values. Null
            when the server chose not to compute it.

    HoldersResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Holder' }

    WalletCollectionHolding:
      type: object
      additionalProperties: false
      required: [collection, count, holderRank]
      properties:
        collection: { $ref: '#/components/schemas/CollectionRef' }
        count: { type: integer, minimum: 1 }
        holderRank:
          type: [integer, 'null']
          minimum: 1
          description: >-
            Rank among this collection's holders. Nullable on purpose —
            computing it requires a full pass over the collection's owners, so
            the server may omit it under load.

    Badge:
      type: object
      additionalProperties: false
      description: >-
        Open-ended by design: `code` is a plain string, not an enum, so adding a
        badge is never a breaking change.
      required: [code, label, collectionSlug, value]
      properties:
        code: { type: string, examples: [full_gang] }
        label: { type: string }
        collectionSlug:
          oneOf:
            - $ref: '#/components/schemas/Slug'
            - type: 'null'
          description: Null for portfolio-wide badges.
        value: { type: [integer, 'null'] }

    WalletPortfolio:
      type: object
      additionalProperties: false
      required: [address, totalCount, collections, badges, nfts]
      properties:
        address: { $ref: '#/components/schemas/Address' }
        totalCount:
          type: integer
          minimum: 0
          description: Assets held across every enabled collection.
        collections:
          type: array
          description: >-
            The full grouping, never paginated — it is bounded by the number of
            enabled collections. Collections with no holdings are omitted;
            ordered by count descending.
          items: { $ref: '#/components/schemas/WalletCollectionHolding' }
        badges:
          type: array
          description: >-
            Always empty in v1. Badge membership is a registry concept, and
            hard-coding a set of slugs in the API would contradict this project's
            rule that collection membership is data, never code. Derive
            client-side instead: a "full set" badge is `collections.length`
            equal to the number of entries `/v1/collections` returns, which
            stays correct when a collection is added. The field is frozen here
            so the server can populate it later without a contract change.
          items: { $ref: '#/components/schemas/Badge' }
        nfts: { $ref: '#/components/schemas/NftPage' }

    SearchRoute:
      type: object
      additionalProperties: false
      description: >-
        Where the Enter key should go. Precedence: an exact mint beats a wallet
        with holdings, which beats an exact collection slug. Never returned when
        the best hit is fuzzy.
      required: [kind, id]
      properties:
        kind:
          type: string
          enum: [nft, wallet, collection]
        id:
          type: string
          description: >-
            The path segment to navigate to — an address for `nft` and `wallet`,
            a slug for `collection`.

    WalletHit:
      type: object
      additionalProperties: false
      required: [address, totalCount]
      properties:
        address: { $ref: '#/components/schemas/Address' }
        totalCount: { type: integer, minimum: 1 }

    SearchGroup:
      type: object
      additionalProperties: false
      required: [collection, total, nfts]
      properties:
        collection: { $ref: '#/components/schemas/CollectionRef' }
        total:
          type: integer
          minimum: 1
          description: Exact number of matches in this collection.
        nfts:
          type: array
          maxItems: 25
          description: >-
            A capped preview, not paginated — deep results belong on the browse
            page with `?q=`.
          items: { $ref: '#/components/schemas/NftSummary' }

    SearchResponse:
      type: object
      additionalProperties: false
      required: [query, interpretedAs, route, wallet, groups]
      properties:
        query: { type: string }
        interpretedAs:
          type: string
          enum: [text, number, address]
          description: How the server parsed the input.
        route:
          oneOf:
            - $ref: '#/components/schemas/SearchRoute'
            - type: 'null'
          description: >-
            Null with empty `groups` and null `wallet` means nothing is indexed
            for this input.
        wallet:
          oneOf:
            - $ref: '#/components/schemas/WalletHit'
            - type: 'null'
          description: Set only when the input is an address that owns indexed assets.
        groups:
          type: array
          description: NFT hits grouped by collection, most hits first.
          items: { $ref: '#/components/schemas/SearchGroup' }

    CollectionPage:
      type: object
      additionalProperties: false
      required: [data, nextCursor, hasMore]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Collection' }
        nextCursor:
          oneOf:
            - $ref: '#/components/schemas/Cursor'
            - type: 'null'
        hasMore:
          type: boolean
          description: Always equal to `nextCursor !== null`. Never computed with a COUNT.

    NftPage:
      type: object
      additionalProperties: false
      description: >-
        A keyset page of cards. No total — see the pagination notes; the
        filtered count is `FacetsResponse.total` and the unfiltered one is
        `CollectionStats.indexed`.
      required: [data, nextCursor, hasMore]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/NftSummary' }
        nextCursor:
          oneOf:
            - $ref: '#/components/schemas/Cursor'
            - type: 'null'
        hasMore: { type: boolean }

    ActivityPage:
      type: object
      additionalProperties: false
      required: [data, nextCursor, hasMore]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/ActivityEvent' }
        nextCursor:
          oneOf:
            - $ref: '#/components/schemas/Cursor'
            - type: 'null'
        hasMore: { type: boolean }

    CollectionActivityPage:
      type: object
      additionalProperties: false
      required: [data, nextCursor, hasMore]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/CollectionActivityEvent' }
        nextCursor:
          oneOf:
            - $ref: '#/components/schemas/Cursor'
            - type: 'null'
        hasMore: { type: boolean }

    OwnershipPage:
      type: object
      additionalProperties: false
      required: [data, nextCursor, hasMore]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/OwnershipInterval' }
        nextCursor:
          oneOf:
            - $ref: '#/components/schemas/Cursor'
            - type: 'null'
        hasMore: { type: boolean }

    FacetValue:
      type: object
      additionalProperties: false
      required: [value, count]
      properties:
        value:
          type: string
          description: Exact and case-sensitive; send it back verbatim to filter on it.
        count: { type: integer, minimum: 0 }

    Facet:
      type: object
      additionalProperties: false
      required: [traitType, values]
      properties:
        traitType: { type: string }
        values:
          type: array
          description: Ordered by count descending, then value.
          items: { $ref: '#/components/schemas/FacetValue' }

    FacetsResponse:
      type: object
      additionalProperties: false
      required: [total, facets]
      properties:
        total:
          type: integer
          minimum: 0
          description: >-
            Size of the result set under the active filters — the number the
            browse grid displays. It lives here because this endpoint already
            pays for the scan.
        facets:
          type: array
          description: Ordered by trait type name.
          items: { $ref: '#/components/schemas/Facet' }

    Error:
      type: object
      additionalProperties: false
      required: [error, message]
      properties:
        error:
          type: string
          enum:
            - invalid_parameter
            - invalid_cursor
            - unsupported_sort
            - not_found
            - rate_limited
            - internal
          description: Machine-readable code. Switch on this.
        message:
          type: string
          description: Human-readable. Never parse it.
        details:
          type: [object, 'null']
          additionalProperties: true
          description: Machine-usable context, or null when there is nothing to add.
