  /v1/collections/{slug}/facets:
    get:
      operationId: getCollectionFacets
      tags: [collections]
      summary: Trait types, values and counts under the active filters
      description: |
        Marketplace-style **disjunctive** faceting. Each trait type's counts are
        computed with **its own** filter removed and every other filter applied,
        so adding a second value inside a type is never a dead end, while
        selecting a value in a different type shrinks this type's numbers.

        Only facetable trait types appear (a collection's `facet_exclude`
        removes per-asset-unique traits like Girl Gang's `Name`). Values with a
        zero count are omitted. Unpaginated by contract — a collection has tens
        of trait values, not thousands.
      parameters:
        - $ref: '#/components/parameters/CollectionSlug'
        - $ref: '#/components/parameters/TraitFilter'
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Facet counts, plus the size of the filtered result set.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
            Vary: { $ref: '#/components/headers/Vary' }
            X-RateLimit-Limit: { $ref: '#/components/headers/XRateLimitLimit' }
            X-RateLimit-Remaining: { $ref: '#/components/headers/XRateLimitRemaining' }
            X-RateLimit-Reset: { $ref: '#/components/headers/XRateLimitReset' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FacetsResponse' }
              examples:
                facets:
                  summary: Unfiltered facets for Piggy SOL Gang
                  value:
                    total: 10000
                    facets:
                      - traitType: Background
                        values:
                          - { value: Pink, count: 1893 }
                          - { value: Blue, count: 1755 }
                          - { value: Mud, count: 1402 }
                          - { value: Gold, count: 91 }
                      - traitType: Head
                        values:
                          - { value: Cap, count: 2210 }
                          - { value: Crown, count: 148 }
                          - { value: Halo, count: 37 }
                      - traitType: Mouth
                        values:
                          - { value: Grin, count: 3011 }
                          - { value: Cigar, count: 219 }
                emptyFacets:
                  summary: Unknown trait type — 200 with nothing, never a 4xx
                  value: { total: 0, facets: [] }
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/collections/{slug}/holders:
    get:
      operationId: getCollectionHolders
      tags: [collections]
      summary: Top holders of a collection
      description: >-
        Ranked by holdings descending. Burned assets have no owner, so they
        never appear here and the counts sum to `stats.supply`. Top-N only, not
        cursor-paginated: each request groups the collection's owner rows, so
        the list is capped rather than pageable. The cohort breakdown lives on
        `CollectionStats.holderDistribution`.
      parameters:
        - $ref: '#/components/parameters/CollectionSlug'
        - name: limit
          in: query
          required: false
          description: How many holders to return, ranked descending.
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: The top holders.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
            Vary: { $ref: '#/components/headers/Vary' }
            X-RateLimit-Limit: { $ref: '#/components/headers/XRateLimitLimit' }
            X-RateLimit-Remaining: { $ref: '#/components/headers/XRateLimitRemaining' }
            X-RateLimit-Reset: { $ref: '#/components/headers/XRateLimitReset' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HoldersResponse' }
              examples:
                top:
                  summary: Top holders
                  value:
                    data:
                      - { address: HLDz7xArdTQeiCeKHg3VqhhNXzZGH5qBS, count: 214, rank: 1 }
                      - { address: HLDLnt2R49161a1QQH7vJoEaFvdtQvqrv, count: 97, rank: 2 }
                      - { address: HLDAXhwhoQo8vntbEMc231443cEQijZ4B, count: 41, rank: 3 }
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/collections/{slug}/activity:
    get:
      operationId: getCollectionActivity
      tags: [collections]
      summary: Recent activity across a collection
      description: >-
        Newest first, ordered by `(slot, id)` descending. Each event carries the
        NFT it happened to, so a recent-activity strip renders cards without a
        second request. `?kind=mint` is the "latest mints" strip for the dynamic
        Core collection.
      parameters:
        - $ref: '#/components/parameters/CollectionSlug'
        - $ref: '#/components/parameters/ActivityKindFilter'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
