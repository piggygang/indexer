  /v1/nfts/{id}:
    get:
      operationId: getNft
      tags: [nfts]
      summary: Full detail for one NFT
      description: >-
        Addressable even when the asset has left its collection
        (`membershipStatus: removed`) or has been burned — both remain valid
        pages with valid history.
      parameters:
        - $ref: '#/components/parameters/NftId'
