[workspace]
members = [
    "services/*",
    "crates/*",
]
resolver = "2"

[workspace.dependencies]
indexer-config = { path = "crates/config" }
indexer-data-model = { path = "crates/data-model" }
indexer-ingest = { path = "crates/ingest" }

# Unused entries below are inert version pins for upcoming issues: helius
# with ALG-621 (DAS backfill), actix-cors with ALG-625 (public API). TLS
# policy: rustls everywhere — sqlx uses runtime-tokio-rustls; when wiring
# reqwest/tungstenite, pick their rustls features too (keeps libssl out of
# the runtime image).
actix-cors = "0.7"
actix-web = "4.11"
anyhow = "1.0"
async-stream = "0.3"
bs58 = "0.5"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dotenv = "0.15"
env_logger = "0.11"
futures-core = "0.3"
futures-util = "0.3"
helius = "0.3.2"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "json", "migrate", "macros"] }
thiserror = "2.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
toml = "0.8"
