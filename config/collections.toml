# Collections / tokens registry seed (ALG-619).
#
# Apply with:  cargo run -p indexer-admin -- seed
# Semantics: upsert by slug (config is the source of truth for every scalar
# column, including `enabled`); mint lists are insert-only; nothing is ever
# deleted — disable a collection instead. Re-running is a no-op.
#
# On-chain addresses live ONLY here and in config/seeds/ — never in Rust or
# in migrations. Adding a collection = one [[collections]] entry (+ a mint
# list for a token_metadata collection without a certified collection), then
# `seed`, then the backfill (ALG-621). No code changes.
version = 1

[[collections]]
slug = "piggy-sol-gang"
name = "Piggy SOL Gang"
standard = "token_metadata"
enabled = true
# No Metaplex certified collection on chain (collection: null on every
# metadata account). Membership = the closed mint list; creator + symbol are
# the on-chain validation signals (creators[0] = verified_creator, verified).
verified_creator = "Pigv3gFWLWJL8QwrFBkdZLe1RYzNJTSJPGEUNVimJjh"
update_authority = "7NsngNMtXJNdHgeK4znQDZ5xVzT2nkGoGRGhMWApejCV"
symbol = "PSG"
mints = { file = "seeds/piggy-sol-gang.mints.json", count = 10000 }
# Re-hosted metadata (the original shdw-drive host is dead); {mint} = the
# mint address. Used by the backfill instead of the on-chain URI.
metadata_uri_template = "https://pub-b1a45763f0a64d8fa271f66f5514a561.r2.dev/old/metadata/{mint}.json"
# Same per-asset-unique "Name" trait ("#6545") as Girl Gang: stored and shown
# on the detail page, never a facet. Without this the backfill would intern
# 10,000 singleton facet values, which bloats /facets and pushes the real
# values out of the planner's MCV list.
facet_exclude = ["Name"]

[[collections]]
slug = "piggy-girl-gang"
name = "Piggy Girl Gang"
standard = "token_metadata"
enabled = true
verified_creator = "Pigv3gFWLWJL8QwrFBkdZLe1RYzNJTSJPGEUNVimJjh"
update_authority = "7NsngNMtXJNdHgeK4znQDZ5xVzT2nkGoGRGhMWApejCV"
symbol = "PGG"
mints = { file = "seeds/piggy-girl-gang.mints.json", count = 5000 }
# All 5,000 on-chain URIs still point at the dead shdw-drive host; the
# re-hosted files are mint-keyed on Vercel Blob (see the Image Rehost project).
metadata_uri_template = "https://rk2cjjujjgvqwsmy.public.blob.vercel-storage.com/piggy-girl-gang-json/{mint}.json"
# The off-chain JSON carries a per-asset-unique "Name" trait ("#1934"):
# shown on the detail page, never a facet.
facet_exclude = ["Name"]

