# Marketplace venue registry (ALG-622).
#
# Apply with:  cargo run -p indexer-admin -- backfill-activity
# After adding an entry:  cargo run -p indexer-admin -- backfill-activity --reprice-only
# — that pass is database-only. The classifier stores the price it derived in
# `activity.details.price_candidate` at crawl time, so teaching it a new venue
# never re-reads the chain.
#
# On-chain addresses live ONLY here and in config/collections.toml and
# config/seeds/ — never in Rust, SQL or tests. That is the whole reason the
# decoder captures every invoked program id as *data*: naming a marketplace is
# a config change, not a code change.
#
# `label` is served verbatim as `ActivityEvent.marketplace`, which the frozen
# v1 contract types as free text precisely so venues can be added without a
# contract change. Only add a program you can actually attribute: the contract
# permits a null marketplace, and an honest `transfer` beats a wrong brand.
version = 1

# Verified against this collection's own history: Helius parses transactions
# invoking this program as NFT_SALE / MAGIC_EDEN, and its escrow authority
# (1BWutmTvYPwDtmw9abTkS4Ssr8no61spGAvW1X6NDix) shows up holding listed pigs.
[[marketplaces]]
program_id = "M2mx93ekt1fmXSVkTrUL9xVFHkmME8HTUi5Cyc5aF7K"
label = "Magic Eden"
note = "v2 (Haus). The v1 program below predates it."

